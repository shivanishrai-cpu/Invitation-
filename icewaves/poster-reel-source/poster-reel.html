<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const main = document.getElementById('c');
const mctx = main.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
let ctx = off.getContext('2d');
const tmp = document.createElement('canvas'); const tctx = tmp.getContext('2d');

const C = {
  maroon: '#A51C30', maroonDeep: '#7A1F2B', textFill: '#FFF4E0',
  waveDeep: '#0E4C8C', wave: '#1C6FB5', waveLight: '#4FA3E6'
};
// wall colour, table colour per scene
const SETS = {
  green:   { wall: [128, 170, 72],  wallTop: [168, 200, 112], table: [196, 222, 160] },
  mustard: { wall: [214, 160, 40],  wallTop: [238, 196, 92],  table: [244, 220, 160] },
  cream:   { wall: [246, 206, 172], wallTop: [252, 226, 200], table: [248, 241, 233] }
};
const DISPLAY = '"Bagel Fat One", "DejaVu Sans", sans-serif';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const easeIO = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const rgbs = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- assets ----------
const IMG = {};
function load(name) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[name] = i; res(); }; i.onerror = rej; i.src = 'assets/' + name + '.png'; }); }
// feature positions as fractions of the trimmed cutout height
const FEAT = { pistachio: { sauce: 0.34, top: 0.05 }, biscoff: { sauce: 0.21, top: 0.05 } };

const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256), r = rng(3);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 110; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }

function soft(x, y, rx, ry, col, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.5, `rgba(${col},${a * 0.6})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// ---------- set ----------
function set(name, horizon = 1260) {
  const S = SETS[name];
  let g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, rgbs(S.wallTop)); g.addColorStop(1, rgbs(S.wall));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);
  g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, rgbs(S.table)); g.addColorStop(1, rgbs(S.table.map(v => v * 0.93)));
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
  g = ctx.createLinearGradient(0, horizon - 40, 0, horizon + 40);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, 'rgba(60,30,20,0.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, horizon - 40, W, 80);
  g = ctx.createRadialGradient(-120, 200, 50, -120, 200, 1800);
  g.addColorStop(0, 'rgba(255,252,240,0.32)'); g.addColorStop(1, 'rgba(255,252,240,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(540, 900, 520, 540, 960, 1400);
  g.addColorStop(0, 'rgba(30,10,10,0)'); g.addColorStop(1, 'rgba(30,10,10,0.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- real glass from the poster ----------
// (cx, baseY) = bottom centre of the glass on screen; s = scale; shine in 0..1
function glass(name, cx, baseY, s, o = {}) {
  const im = IMG[name], w = im.width * s, h = im.height * s;
  if (o.shadow !== false) {
    soft(cx + w * 0.42, baseY - 6, w * 0.95, 34 * Math.max(0.6, s), '60,30,20', 0.28);
    soft(cx + w * 0.05, baseY - 4, w * 0.55, 16 * Math.max(0.6, s), '40,20,10', 0.45);
  }
  if (o.shine >= 0 && o.shine <= 1) {
    tmp.width = im.width; tmp.height = im.height;
    tctx.clearRect(0, 0, tmp.width, tmp.height);
    tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(im, 0, 0);
    tctx.globalCompositeOperation = 'source-atop';
    const x = -im.width * 0.5 + o.shine * im.width * 2;
    tctx.save(); tctx.translate(x, im.height / 2); tctx.rotate(0.32);
    const g = tctx.createLinearGradient(-im.width * 0.16, 0, im.width * 0.16, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    tctx.fillStyle = g; tctx.fillRect(-im.width * 0.16, -im.height, im.width * 0.32, im.height * 2);
    tctx.restore(); tctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(tmp, cx - w / 2, baseY - h, w, h);
  } else {
    ctx.drawImage(im, cx - w / 2, baseY - h, w, h);
  }
}
// draw glass so that a feature (fraction of height) sits at screen point (fx, fy)
function glassAt(name, frac, fx, fy, s, o) {
  const h = IMG[name].height * s;
  glass(name, fx, fy + (1 - frac) * h, s, Object.assign({ shadow: false }, o));
}

function star(x, y, s, a) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a; ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.16 : s; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
  ctx.closePath(); ctx.fill();
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.7); g.addColorStop(0, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- wave ----------
function drawWave(p) {
  if (p <= 0 || p >= 1) return;
  const PW = W * 1.35, Lx = -PW + p * (W + PW), Rx = Lx + PW;
  const left = y => Lx + 50 * Math.sin(y / 230 + 0.4);
  const right = y => Rx + 60 * Math.sin(y / 280 + 1.3) + (y < 520 ? 120 * Math.sin((y / 520) * Math.PI) : 0);
  const path = () => { ctx.beginPath(); ctx.moveTo(left(0), 0); for (let y = 0; y <= H; y += 30) ctx.lineTo(right(y), y); for (let y = H; y >= 0; y -= 30) ctx.lineTo(left(y), y); ctx.closePath(); };
  const g = ctx.createLinearGradient(Lx, 0, Rx, 0);
  g.addColorStop(0, C.waveDeep); g.addColorStop(0.7, C.wave); g.addColorStop(1, C.waveLight);
  ctx.fillStyle = g; path(); ctx.fill();
  ctx.save(); path(); ctx.clip();
  for (let k = 1; k <= 5; k++) {
    ctx.strokeStyle = `rgba(255,255,255,${0.07 + k * 0.02})`; ctx.lineWidth = 14 - k;
    ctx.beginPath();
    for (let y = 0; y <= H; y += 30) { const x = right(y) - k * 110 + 26 * Math.sin(y / 110 + k * 1.7); y ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  const cy = 300, cxp = right(cy) - 120;
  const hg = ctx.createRadialGradient(cxp, cy, 10, cxp, cy, 220); hg.addColorStop(0, 'rgba(8,40,80,0.55)'); hg.addColorStop(1, 'rgba(8,40,80,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cxp, cy, 220, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const r = rng(Math.floor(p * 400));
  ctx.fillStyle = '#FFFFFF';
  for (let y = -20; y < H + 40; y += 22) { const x = right(y) - 8; ctx.beginPath(); ctx.arc(x, y, 18 + 10 * Math.abs(Math.sin(y * 0.37)), 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 40; i++) { const y = r() * H; const x = right(y) + 20 + r() * 90; ctx.beginPath(); ctx.arc(x, y, 3 + r() * 7, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let i = 0; i < 60; i++) { const y = r() * H; const x = right(y) - 30 - r() * 200; ctx.beginPath(); ctx.arc(x, y, 2 + r() * 5, 0, Math.PI * 2); ctx.fill(); }
}

// ---------- typography (same family + maroon as the poster headline) ----------
function wordsLayout(lines) {
  const out = []; let y = 0;
  for (const ln of lines) {
    const size = ln.size || 96;
    ctx.font = `${size}px ${DISPLAY}`;
    const words = ln.text.split(' '), space = ctx.measureText(' ').width;
    const widths = words.map(w => ctx.measureText(w).width);
    const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
    const scale = Math.min(1, 950 / total);
    let x = -total * scale / 2;
    words.forEach((w, i) => { out.push({ w, x: x + widths[i] * scale / 2, y, size: size * scale, color: ln.color, stroke: ln.stroke }); x += (widths[i] + space) * scale; });
    y += size * scale * 1.1;
  }
  return out;
}
function drawText(lines, t, t0, t1, y0, cx = 540) {
  if (t < t0 || t >= t1) return;
  const out = clamp((t1 - t) / 0.12);
  wordsLayout(lines).forEach((wd, i) => {
    const lp = (t - t0 - i * 0.06) / 0.32; if (lp <= 0) return;
    const k = backOut(lp);
    ctx.save();
    ctx.translate(cx + wd.x, y0 + wd.y + (1 - easeOut(lp)) * 50);
    ctx.scale(0.4 + 0.6 * k, 0.4 + 0.6 * k); ctx.rotate((1 - easeOut(lp)) * -0.12);
    ctx.globalAlpha = clamp(lp * 3) * out;
    ctx.font = `${wd.size}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    ctx.fillStyle = 'rgba(42,18,21,0.35)'; ctx.fillText(wd.w, 5, 10);
    ctx.strokeStyle = wd.stroke || C.textFill; ctx.lineWidth = wd.size * 0.2; ctx.strokeText(wd.w, 0, 0);
    ctx.fillStyle = wd.color || C.maroon; ctx.fillText(wd.w, 0, 0);
    ctx.restore();
  });
}
function priceBadge(cx, cy, t, t0, t1) {
  if (t < t0 || t >= t1) return;
  const lp = (t - t0) / 0.4, k = backOut(lp), out = clamp((t1 - t) / 0.12);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.2 + (1 - easeOut(lp)) * 0.8 + 0.03 * Math.sin(t * 5)); ctx.scale(k, k); ctx.globalAlpha = clamp(lp * 4) * out;
  ctx.fillStyle = 'rgba(42,18,21,0.3)'; ctx.beginPath(); ctx.arc(8, 12, 108, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.maroon; ctx.beginPath(); ctx.arc(0, 0, 108, 0, Math.PI * 2); ctx.fill();
  ctx.setLineDash([10, 9]); ctx.strokeStyle = C.textFill; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = C.textFill; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `70px ${DISPLAY}`; ctx.fillText('₹160', 0, 6);
  ctx.restore();
}
function pin(x, y, s, a) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.fillStyle = C.maroon; ctx.beginPath(); ctx.arc(0, -30, 26, Math.PI, 0); ctx.lineTo(0, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -30, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.textFill; ctx.beginPath(); ctx.arc(0, -30, 10, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function popImage(name, cx, cy, s, t, t0, t1, spin = 0) {
  if (t < t0 || (t1 !== undefined && t >= t1)) return;
  const im = IMG[name], lp = (t - t0) / 0.45, k = backOut(lp);
  const out = t1 === undefined ? 1 : clamp((t1 - t) / 0.15);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((1 - easeOut(lp)) * spin); ctx.scale(s * k, s * k); ctx.globalAlpha = clamp(lp * 4) * out;
  ctx.drawImage(im, -im.width / 2, -im.height / 2);
  ctx.restore();
}

// ---------- shots ----------
const CUTS = [2.0, 3.5, 5.0, 9.0, 10.5, 12.0];
function punch(t) { for (const c of CUTS) if (t >= c && t < c + 0.4) return 1 + 0.04 * Math.exp(-(t - c) * 9); return 1; }

function macroSauce(name, t, t0, t1, set_) {
  set(set_);
  const k = easeIO(prog(t, t0, t1));
  glassAt(name, FEAT[name].sauce, 540 + lerp(140, -140, k), 960, 2.7 + 0.15 * k);
}
function tiltUp(name, t, t0, t1, set_) {
  set(set_);
  const k = easeIO(prog(t, t0, t1)), s = 1.55, h = IMG[name].height * s;
  glass(name, 540, lerp(1560, 520 + h, k), s, { shadow: false });
}
function macroTop(name, t, t0, t1, set_) {
  set(set_);
  const k = easeIO(prog(t, t0, t1));
  glassAt(name, FEAT[name].top + 0.04, 540, 1000, 2.5 + 0.35 * k);
}
function hero(name, t, t0, t1, set_) {
  set(set_);
  const k = easeIO(prog(t, t0, t1)), s = 0.78 + 0.05 * k;
  glass(name, 540, 1470, s, { shine: prog(t, t0 + 0.4, t0 + 1.4) });
}

// duo + end card layout, continuous from 14.0 to 23.0
function finale(t) {
  set('cream');
  const rise1 = backOut(prog(t, 14.05, 14.5)), rise2 = backOut(prog(t, 14.15, 14.6));
  const m = easeIO(prog(t, 16.1, 16.6));   // duo -> with headline
  const e = easeIO(prog(t, 18.4, 18.9));   // -> end card
  const s = lerp(lerp(0.72, 0.6, m), 0.4, e);
  const base = 1460;
  const gap = lerp(lerp(225, 200, m), 150, e);
  glass('biscoff', 540 - gap, base + (1 - rise1) * 400, s, { shine: prog(t, 14.8, 15.7) });
  glass('pistachio', 540 + gap, base + (1 - rise2) * 400, s, { shine: prog(t, 14.95, 15.85) });
  star(540 - gap - 120, 760, 42, Math.sin(prog(t, 14.6, 15.1) * Math.PI));
  star(540 + gap + 110, 720, 36, Math.sin(prog(t, 14.75, 15.25) * Math.PI));
  // poster headline (real artwork)
  popImage('headline', 540, 545, 0.66, t, 16.3, 18.45, 0.15);
  // poster logo (real artwork)
  popImage('logo', 540, 505, 1.3, t, 18.55, undefined, -0.25);
  star(770, 360, 40, Math.sin(prog(t, 19.0, 19.45) * Math.PI));
  star(310, 640, 30, Math.sin(prog(t, 19.15, 19.6) * Math.PI));
}

function scene(t) {
  if (t < 1.0) macroSauce('pistachio', t, 0, 1.0, 'green');
  else if (t < 2.0) { set('green'); const k = backOut(prog(t, 1.0, 1.45)); glass('pistachio', 540, 1470 + (1 - k) * 300, 0.8, { shine: prog(t, 1.3, 2.0) }); star(420, 640, 46, Math.sin(prog(t, 1.4, 1.9) * Math.PI)); }
  else if (t < 3.5) tiltUp('pistachio', t, 2.0, 3.5, 'green');
  else if (t < 5.0) macroTop('pistachio', t, 3.5, 5.0, 'green');
  else if (t < 7.0) hero('pistachio', t, 5.0, 7.0, 'green');
  else if (t < 9.0) macroSauce('biscoff', t, 7.0, 9.0, 'mustard');
  else if (t < 10.5) tiltUp('biscoff', t, 9.0, 10.5, 'mustard');
  else if (t < 12.0) macroTop('biscoff', t, 10.5, 12.0, 'mustard');
  else if (t < 14.0) hero('biscoff', t, 12.0, 14.0, 'mustard');
  else if (t < 23.0) finale(t);
  else macroSauce('pistachio', 0, 0, 1.0, 'green');   // loop: identical to frame 0

  drawWave(prog(t, 0.5, 1.5));
  drawWave(prog(t, 6.5, 7.5));
  drawWave(prog(t, 13.5, 14.5));
  drawWave(prog(t, 22.5, 23.5));
}

function overlays(t) {
  drawText([{ text: 'A new wave' }, { text: 'just hit' }, { text: 'Uliyathaduka', size: 104 }], t, 0.05, 1.95, 380);
  drawText([{ text: 'Kunafa on top', size: 110 }], t, 3.5, 5.0, 470);
  drawText([{ text: 'Pistachio' }, { text: 'Kunafa Shake', size: 88 }], t, 5.0, 6.85, 390);
  priceBadge(860, 760, t, 5.35, 6.85);
  drawText([{ text: 'Kunafa on top', size: 110 }], t, 10.5, 12.0, 470);
  drawText([{ text: 'Biscoff' }, { text: 'Kunafa Shake', size: 88 }], t, 12.0, 13.85, 390);
  priceBadge(860, 760, t, 12.35, 13.85);
  drawText([{ text: 'Catch the wave', size: 116 }], t, 14.3, 16.15, 520);
  // CTA on the end card
  drawText([{ text: 'Visit us in', size: 60 }], t, 19.1, 22.85, 800);
  if (t >= 19.4 && t < 22.85) pin(225, 895, 1.05, clamp((t - 19.4) / 0.2) * clamp((22.85 - t) / 0.12));
  drawText([{ text: 'Uliyathaduka', size: 100 }], t, 19.3, 22.85, 895, 565);
}

function renderSub(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const p = punch(t);
  ctx.save(); ctx.translate(540, 960); ctx.scale(p, p); ctx.translate(-540, -960);
  scene(t);
  ctx.restore();
  overlays(t);
}
function needsBlur(t) {
  const w = (a, b) => t > a - 0.05 && t < b + 0.05;
  return w(0.5, 1.5) || w(6.5, 7.5) || w(13.5, 14.6) || w(22.5, 23.5) || w(18.5, 19.0) || w(16.2, 16.7);
}
function render(T, sub) {
  if (sub === undefined) sub = needsBlur(T) ? 3 : 1;
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalAlpha = 1;
  const shutter = (1 / 30) * 0.5;
  for (let j = 0; j < sub; j++) {
    renderSub(T + (sub > 1 ? (j / (sub - 1) - 0.5) * shutter : 0));
    mctx.globalAlpha = 1 / (j + 1); mctx.drawImage(off, 0, 0);
  }
  mctx.globalAlpha = 0.05; mctx.globalCompositeOperation = 'overlay';
  const ox = Math.floor((T * 997) % 256), oy = Math.floor((T * 613) % 256);
  mctx.save(); mctx.translate(-ox, -oy); mctx.fillStyle = mctx.createPattern(grain, 'repeat'); mctx.fillRect(0, 0, W + 256, H + 256); mctx.restore();
  mctx.globalCompositeOperation = 'source-over'; mctx.globalAlpha = 1;
}
window.render = render;
window.ready = Promise.all([load('pistachio'), load('biscoff'), load('logo'), load('headline'), document.fonts.load(`96px "Bagel Fat One"`)])
  .then(() => document.fonts.ready).then(() => { render(0); return true; });
</script>
</body></html>
